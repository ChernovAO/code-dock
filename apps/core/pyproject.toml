[project]
name = "core"
version = "0.1.0"
description = "Бэкенд Code Dock на FastAPI: прокси к opencode, git и файловые операции"
readme = "README.md"
authors = [
    { name = "ChernovAO", email = "chernov.aleksandre@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.157.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.pytest.ini_options]
addopts = "--cov=core"
testpaths = ["tests"]
