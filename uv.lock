version = 1
revision = 3
requires-python = ">=3.14"

[manifest]
members = [
    "code-dock",
    "core",
]

[[package]]
name = "code-dock"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "core" },
]

[package.metadata]
requires-dist = [{ name = "core", editable = "apps/core" }]

[[package]]
name = "core"
version = "0.1.0"
source = { editable = "apps/core" }
